# ---------- WordPress / connexion BDD ----------
wp_db_name: wordpress
wp_db_user: wordpress
wp_db_password: "wordpress"
wp_db_host: "{{ hostvars[groups['db'][0]]['ansible_host'] }}"
wp_web_host: "{{ hostvars[groups['web'][0]]['ansible_host'] }}"

wp_install_dir: /var/www/wordpress
wp_archive_url: https://fr.wordpress.org/latest-fr_FR.tar.gz

# ---------- MySQL (geerlingguy.mysql) ----------
mysql_root_password: root
mysql_user_home: /root
mysql_user_name: root
mysql_user_password: root
mysql_bind_address: "0.0.0.0"

mysql_databases:
  - name: "{{ wp_db_name }}"
    encoding: utf8mb4
    collation: utf8mb4_unicode_ci

mysql_users:
  - name: "{{ wp_db_user }}"
    host: "{{ wp_web_host }}"
    password: "{{ wp_db_password }}"
    priv: "{{ wp_db_name }}.*:ALL"

# ---------- PHP (geerlingguy.php) ----------
php_enable_php_fpm: true
php_webserver_daemon: apache2
php_packages_extra:
  - php-mysql

# ---------- Apache (geerlingguy.apache) ----------
apache_remove_default_vhost: true
apache_mods_enabled:
  - rewrite
  - ssl
  - proxy
  - proxy_fcgi

apache_vhosts:
  - servername: "wordpress.local"
    documentroot: "{{ wp_install_dir }}"
    extra_parameters: |
      DirectoryIndex index.php index.html
      ProxyPassMatch ^/(.*\.php(/.*)?)$ "fcgi://127.0.0.1:9000{{ wp_install_dir }}/$1"