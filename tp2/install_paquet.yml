---
- name: Installation et configuration paquet
  hosts: apache

  tasks:
    - name: Mettre à jour la liste des paquets
      ansible.builtin.apt:
        update_cache: yes

    - name: Installer les paquets apache2 et mysql-server
      ansible.builtin.apt:
        name: "{{ item }}"
        state: present
      loop:
        - apache2
        - mysql-server

    - name: Récupérer la liste des paquets installés
      ansible.builtin.package_facts:
        manager: auto

    - name: Modifier fichier html
      ansible.builtin.copy:
        content: "<h1>Bonjour depuis Ansible</h1>"
        dest: "/var/www/html/index.html"
      when: "'apache2' in ansible_facts.packages"

    - name: Démarrer et activer le service
      ansible.builtin.service:
        name: "apache2"
        state: started
        enabled: yes
      when: "'apache2' in ansible_facts.packages"