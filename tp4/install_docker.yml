---
- name: Installation docker
  hosts: all

  vars:
    user_ambient: ambient_user
    docker_users:
      - "{{ user_ambient }}"

  roles:
    - geerlingguy.docker

  tasks:
    - name: Vérifier la permission docker pour l'utilisateur {{ user_ambient }}
      ansible.builtin.command: docker ps
      changed_when: false
