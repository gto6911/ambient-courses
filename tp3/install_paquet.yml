---
- name: Installation et configuration paquet
  hosts: all

  tasks:
    - name: Mettre à jour la liste des paquets
      ansible.builtin.apt:
        update_cache: true

    - name: Installer les paquets apache2 et mysql-server
      ansible.builtin.apt:
        name: "{{ item }}"
        state: present
      loop:
        - apache2
        - mysql-server
      when: "inventory_hostname in groups['apache']"

 #   - name: Désinstaller le paquets apache2
 #     ansible.builtin.apt:
 #       name: "apache2"
 #       state: absent
 #     loop:
 #       - apache2
 #     when: "inventory_hostname in groups['master']"

    - name: Installer les paquets git, nginx et cosway
      ansible.builtin.apt:
        name: "{{ item }}"
        state: present
      loop:
        - git
        - nginx
        - cowsay
      when: "inventory_hostname in groups['master']"

    - name: Installer le paquet ufw sur Ubuntu
      ansible.builtin.apt:
        name: "ufw"
        state: present
      when: "ansible_facts['distribution'] == 'Ubuntu'"

    - name: Récupérer la liste des paquets installés
      ansible.builtin.package_facts:
        manager: auto

    - name: Modifier fichier html uniquement si apache2 ou nginx installé
      ansible.builtin.copy:
        content: "<h1>Bonjour depuis Ansible {{ inventory_hostname }}</h1>"
        dest: "/var/www/html/index.html"
        mode: "0644"
      when: "'apache2' in ansible_facts.packages or 'nginx' in ansible_facts.packages"

    - name: Démarrer et activer le service web
      ansible.builtin.service:
        name: "{{ item }}"
        state: started
        enabled: true
      loop:
        - apache2
        - nginx
      when: "item in ansible_facts.packages"

    - name: Récupérer le jour et calculer la parité
      ansible.builtin.set_fact:
        est_pair: "{{ (ansible_facts['date_time']['day'] | int % 2) == 0 }}"

    - name: Récupérer l'heure et savoir si on est avant 12h"
      ansible.builtin.set_fact:
        est_avant_midi: "{{ (ansible_facts['date_time']['hour'] | int) < 12 }}"

    - name: Copier le fichier template dans /etc/jour
      ansible.builtin.template:
        src: template/day.j2
        dest: /etc/jour
        mode: "0644"
