---
- name: Faire le café
  hosts: coffee

  vars:
    temparature_csv: "input/temperature.csv"
    temperature_result: "/tmp/temperature_result.csv"

  tasks:
    - name: "Affichage du contenu de {{ temparature_csv }}"
      ansible.builtin.debug:
        msg: "{{ lookup('ansible.builtin.file', temparature_csv).splitlines() }}"

    - name: "Création de {{ temperature_result }} sans doublons"
      ansible.builtin.copy:
        content: "{{ lookup('ansible.builtin.file', temperature_csv).splitlines() | unique | join('\n') }}\n"
        dest: "{{ temperature_result }}"
        mode: "0644"
